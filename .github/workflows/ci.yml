name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time; a newer push cancels the older run so two
# runs never race on the same immutable ECR tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, cart, order]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt -r services/requirements-dev.txt

      - name: Ruff
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check --config ../../pyproject.toml .
          ruff format --check --config ../../pyproject.toml .

      - name: Pytest
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  validate-infra:
    name: Validate Terraform & manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"

      - name: Terraform fmt & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /dev/null

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public (base images)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Nginx config test (web)
        run: |
          docker build -q -t shopstack-web:ci services/web
          docker run --rm shopstack-web:ci nginx -t

  build-push:
    name: Build & push (${{ matrix.service }})
    needs: [test, validate-infra]
    # Images are only published from main; pull requests stop at tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC federation to AWS
    strategy:
      matrix:
        service: [catalog, cart, order, web]
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims (sub/aud/iss only, for trust-policy debugging)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref}'

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Amazon ECR Public (base images)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # Tags are immutable, so a re-run of an already-published commit must
      # not try to push again.
      - name: Check whether this tag is already published
        id: exists
        run: |
          if aws ecr describe-images --repository-name shopstack/${{ matrix.service }} \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.published == 'false'

      - name: Build and push
        if: steps.exists.outputs.published == 'false'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: APP_VERSION=${{ github.sha }}
          # Repository tags are immutable, so every commit gets its own tag.
          tags: ${{ steps.ecr.outputs.registry }}/shopstack/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed shopstack/${{ matrix.service }}:${{ github.sha }} — deploy with scripts/deploy.sh ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
