# Local stand-in for the ALB path routing (compose only; not shipped in any image).
server {
    listen 8080;
    location /catalog/ { proxy_pass http://catalog:8080; }
    location /cart/    { proxy_pass http://cart:8080; }
    location /orders   { proxy_pass http://order:8080; }
    location /         { proxy_pass http://web:8080; }
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
}
