# Static storefront. API calls go to the same origin (/catalog, /cart, /orders)
# and are routed by the ALB to the backend services, so no CORS is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Served-By $hostname always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ready {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    # hashed-free static assets: short cache, always revalidate
    location ~* \.(css|js|svg|png|ico)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Served-By $hostname always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
