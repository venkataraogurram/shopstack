apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopstack

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - catalog.yaml
  - cart.yaml
  - order.yaml
  - web.yaml
  - ingress.yaml

# The product list is mounted into the catalog pods; edit config/products.json
# and re-apply to change the catalog without rebuilding the image. The hash
# suffix forces a rolling restart whenever the content changes.
configMapGenerator:
  - name: catalog-products
    files:
      - products.json=config/products.json

# Deployments reference placeholder images (shopstack/<service>:dev). The ECR
# registry and the immutable image tag are supplied at deploy time by an
# overlay that scripts/deploy.sh generates, so no account ID lives in git.
