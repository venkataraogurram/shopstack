# One ServiceAccount per workload. cart and order are bound to IAM roles through
# EKS Pod Identity associations created by Terraform (terraform/pod-identity.tf);
# catalog needs no AWS access and therefore has no association.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: shopstack
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shopstack
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart
  namespace: shopstack
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: shopstack
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order
  namespace: shopstack
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: shopstack
automountServiceAccountToken: false
